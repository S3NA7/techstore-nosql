[pytest]
pythonpath = .
testpaths = tests
markers =
    integration: exige os três bancos no ar (docker compose up -d) e RECARREGA os dados (seed --reset)
# Por padrão só os testes unitários rodam (sem Docker, sem tocar nos bancos).
# Para o fluxo completo contra os containers: pytest -m integration
addopts = -m "not integration"
